services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped
    env_file:
      - .env
    pull_policy: daily
    tty: true
    stdin_open: true
#    ports:
#      - "26969:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FTBA"
      MEMORY: "20G"
      FTB_MODPACK_ID: "125"
      FTB_MODPACK_VERSION_ID: "100268"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
    volumes:
      - mcdata:/data
    networks:
      proxy:
        ipv4_address: ${IPVLAN_IP}

networks:
  proxy:
    external: true

volumes:
  mcdata:
    external: true
